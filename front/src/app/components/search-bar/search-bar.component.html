<div class="main">
    <div class="container">
        <div class="left">
            <div class="left_image">
                <img src="images/magnifying_glass.svg" alt="search icon">
            </div>
            <div class="input_container">
                <input 
                    type="text" 
                    placeholder="Search GitHub User..." 
                    (input)="displayInputText($event)" 
                    (keydown.enter)="callServer()"
                    />
            </div>
        </div>
        <div class="right">
            <div class="right_button">
                <button class="button" (click)="callServer()">Enter</button>
            </div>
        </div>
    </div>
</div>
